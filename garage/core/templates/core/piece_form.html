{% extends "core/base.html" %}

{% block title %}{{ action }} Pièce - Garage Management{% endblock %}

{% block content %}
<div class="card">
    <div class="card-header">
        <h2>{{ action }} une pièce</h2>
    </div>
    
    <form method="POST" enctype="multipart/form-data" class="p-20">
        {% csrf_token %}
        <div class="form-group">
            <label for="nom">Nom</label>
            <input type="text" id="nom" name="nom" value="{{ piece.nom|default_if_none:'' }}" required>
        </div>
        <div class="form-group">
            <label for="prix">Prix (Ar)</label>
            <input type="number" id="prix" name="prix" step="0.01" value="{{ piece.prix|default_if_none:'' }}" required>
        </div>
        <div class="form-group">
            <label for="stock">Stock</label>
            <input type="number" id="stock" name="stock" value="{{ piece.stock|default_if_none:'' }}" required>
        </div>
        <!-- ⚠️ NOUVEAU CHAMP IMAGE ⚠️ -->
        <div class="form-group">
            <label for="image">Image de la pièce</label>
            {% if piece and piece.image %}
                <div style="margin-bottom: 10px;">
                    <img src="{{ piece.image.url }}" alt="{{ piece.nom }}" style="width: 100px; height: 100px; object-fit: cover; border-radius: 8px;">
                    <p style="font-size: 12px; color: rgba(255,255,255,0.6); margin-top: 5px;">Image actuelle</p>
                </div>
            {% endif %}
            <input type="file" id="image" name="image" accept="image/*" class="form-control">
            <small style="color: rgba(255,255,255,0.5);">Formats acceptés: JPG, PNG (max 5MB)</small>
        </div>
        <div class="btn-group">
            <button type="submit" class="btn btn-primary">{{ action }}</button>
            <a href="{% url 'piece_list' %}" class="btn btn-secondary">Retour</a>
        </div>
    </form>
</div>
{% endblock %}
