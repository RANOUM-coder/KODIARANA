{% extends "core/base.html" %}

{% block title %}Supprimer Client - Garage Management{% endblock %}

{% block content %}
<div class="card">
    <div class="card-header">
        <h2>Supprimer un client</h2>
    </div>
    <p>Voulez-vous vraiment supprimer le client <strong>{{ client.nom }}</strong> ?</p>
    <form method="POST" class="p-20">
        {% csrf_token %}
        <div class="btn-group">
            <button type="submit" class="btn btn-danger">Confirmer la suppression</button>
            <a href="{% url 'client_list' %}" class="btn btn-secondary">Annuler</a>
        </div>
    </form>
</div>
{% endblock %}
