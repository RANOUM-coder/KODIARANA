{% extends "core/base.html" %}

{% block title %}{{ action }} Moto - Garage Management{% endblock %}

{% block content %}
<div class="card">
    <div class="card-header">
        <h2>{{ action }} une moto</h2>
    </div>
    <form method="POST" class="p-20">
        {% csrf_token %}
        <div class="form-group">
            <label for="client">Client</label>
            <select id="client" name="client" required>
                <option value="">Sélectionnez un client</option>
                {% for client in clients %}
                <option value="{{ client.id }}" {% if moto and moto.Client.id == client.id %}selected{% endif %}>{{ client.nom }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label for="marque">Marque</label>
            <input type="text" id="marque" name="marque" value="{{ moto.marque|default_if_none:'' }}" required>
        </div>
        <div class="form-group">
            <label for="model">Modèle</label>
            <input type="text" id="model" name="model" value="{{ moto.model|default_if_none:'' }}" required>
        </div>
        <div class="btn-group">
            <button type="submit" class="btn btn-primary">{{ action }}</button>
            <a href="{% url 'moto_list' %}" class="btn btn-secondary">Retour</a>
        </div>
    </form>
</div>
{% endblock %}
